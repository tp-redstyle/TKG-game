<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1024">
<link rel="icon" href="rice.png">
<title>-THE TKG GAME-</title>
<style>
* {user-select:none; font-family:"MS Mincho","MS PMincho","Hiragino Mincho PnoN","serif"; overflow-y:hidden;}

h1 {font-size:clamp(50px, 3.4vw, 60px); top:6%; left:50%; position:absolute; transform:translate(-50%,-50%); text-shadow:0px 0px 5px #ff77aa;white-space:nowrap;}

h2 {font-size:clamp(30px, 2.5vw, 40px); top:14%; left:50%; position:absolute; transform:translate(-50%,-50%); text-shadow:0px 0px 5px #3333ff;z-index:80;}

#CLICK {font-size:50px; top:40%; left:50%; position:absolute; transform:translate(-50%,-50%); text-shadow:0px 0px 10px #55aaff; font-weight:bold;; display:none;}

#CLICK.show {display:block;}


#rice {
top:80%;
left:50%;
position:absolute;
transform:translate(-50%,-50%);}


#startBTN {
top:50%;
left:50%;
position:absolute;
transform:translate(-50%,-50%);
font-size:50px;
background-color:#ffff55;
color:#333333;
border-radius:8px;
display:block;}

#startBTN.hide {display:none;}


#egg {display:none;}

#egg.show {display:block;}
#eggdiv {top:20%; left:0px; position:absolute;}


#gouhi {
top:50%;
left:50%;
position:absolute;
transform:translate(-50%,-50%);
font-size:80px;
padding:20px;
background-color:white;
color:#000000;
text-shadow:0px 0px 4px #22ff55;
box-shadow:8px 8px 15px #000000;
border-radius:8px;
display:none;}

#gouhi.show {display:block;}

#next {
display:none;
top:70%;
left:70%;
transform:translate(-50%,-50%);
position:absolute;
background-color:#ff44dd;
border-radius:4px;
font-size:40px;
z-index:99;}

#next.show {display:block;}

#renzoku {
top:24%;
left:50%;
position:absolute;
transform:translate(-50%,-50%);
text-shadow:0px 0px 5px #ffff00;}


#startBTN:active, #next:active {transform:scale(0.9) translate(-55%,-55%);}

#superimg {z-index:999998; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);}

</style>
</head>
<body>
<h1>卵を落としてTKGを作るゲーム</h1>
<h2>おいしいTKGを作れ！！</h2>
<img src="rice.png" alt="ごはん" id="rice">
<div id="eggdiv"><img src="egg.png" alt="卵" id="egg"></div>
<div id="gouhi"></div>
<div id="renzoku"></div>
<div id="superimg"></div>
<div id="CLICK">クリックで卵を割る</div>
<img src="background.png" alt="テーブル" style="z-index:-10;top:50%; left:50%; transform:translate(-50%,-50%);position:absolute; width:100%; height:100%;">
<img src="stick.png" alt="stick" style="position:absolute;transform:translate(-50%,-50%); top:99%;left:52%;">
<button id="startBTN">スタート</button>
<button id="next">次へ</button>
<script src="TKG.js"></script>
</body>
</html>
